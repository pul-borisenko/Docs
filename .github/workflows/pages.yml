# ЛР 1.2, задача 2: «Опубликовать код как вики» → публикация папки docs/ на GitHub Pages.
name: Публикация документации

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка сайта MkDocs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Установка MkDocs
        run: python -m pip install -r requirements.txt

      - name: Сборка (ошибки ссылок останавливают публикацию)
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: mkdocs build --strict

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Публикация на GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
